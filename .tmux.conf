# ============================================================
# GENERAL OPTIONS
# ============================================================

set -g mouse on
set -g default-terminal "tmux-256color"

# Keep tmux from interfering with terminal alternate-screen
set -g terminal-overrides ',xterm*:smcup@:rmcup@'


# ============================================================
# PLUGINS
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'


# ============================================================
# CATPPUCCIN
# ============================================================

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load Catppuccin BEFORE using its modules
run '~/.tmux/plugins/tmux/catppuccin.tmux'


# ============================================================
# STATUS LINE
# ============================================================

set -g status-left-length 100
set -g status-right-length 100

set -g status-left ""

set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"


# ============================================================
# CLIPBOARD
# ============================================================

# We are using xclip.
#
# Your system is Wayland, but xclip is working through XWayland,
# as confirmed by:
#
# echo "TEST123" | xclip -selection clipboard
# xclip -selection clipboard -o
#
# Therefore use xclip directly from tmux.


# ------------------------------------------------------------
# Mouse selection -> system clipboard
# ------------------------------------------------------------

bind -T copy-mode MouseDragEnd1Pane \
    send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

bind -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"


# ------------------------------------------------------------
# Keyboard copy mode
# ------------------------------------------------------------

# Enter copy mode:
# Ctrl+B then [

# In copy mode:
# y = copy selection to system clipboard

bind -T copy-mode-vi y \
    send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"


# ============================================================
# PASTE FROM SYSTEM CLIPBOARD
# ============================================================

# Ctrl+B then p
# Pastes the current system clipboard into tmux.

bind p run-shell "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"


# ============================================================
# OPTIONAL: CTRL+V PASTE
# ============================================================

# Ctrl+V inside tmux -> paste system clipboard
#
# This intentionally changes Ctrl+V only.
# We do NOT change Ctrl+C because Ctrl+C is needed to interrupt
# programs such as ping, top, ssh sessions, etc.

bind -n C-v run-shell "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"


# ============================================================
# TPM
# ============================================================

# TPM MUST be initialized LAST
run '~/.tmux/plugins/tpm/tpm'
