# Enable mouse support
set -g mouse on

# Use vi-style keys in copy mode
setw -g mode-keys vi

# Better scrollback history
set -g history-limit 100000

# Start windows and panes numbering from 1
set -g base-index 1
setw -g pane-base-index 1

# Faster escape key response
set -sg escape-time 0

# Enable clipboard integration (requires xclip/xsel on Linux)
set -g set-clipboard on

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# Enter copy mode with Prefix + [
bind [ copy-mode

# Vi keybindings in copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Allow Shift + Mouse drag to select text in the terminal
set -g terminal-overrides ',xterm*:smcup@:rmcup@'
